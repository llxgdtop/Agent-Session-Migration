# CI: build, lint (fmt + clippy) and test the workspace across 5 platforms.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-2022, macos-13, macos-14]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # eframe (X11/Wayland) link dependencies, Linux only.
      - name: Install GUI dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        shell: bash
        run: |
          set +e
          cargo clippy --all-targets -- -D warnings > clippy.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            # Surface every error line plus the log tail as annotations so
            # the root cause is readable without downloading full logs
            # (annotations cap at 50 per step). ANSI colors are stripped
            # first: colored error lines would not match plain grep.
            { sed "s/\x1b\[[0-9;]*m//g" clippy.log | grep -B2 -A8 -E "^error" | head -40; } \
              | while IFS= read -r line; do
                [ -n "$line" ] && echo "::error::${line}"
              done
          fi
          exit $code

      - name: Test
        run: cargo test --all
