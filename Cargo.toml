[workspace]
resolver = "2"
members = ["crates/hub-core", "crates/hub-app"]

# Release tuning for the shipped desktop app: strip symbols, thin-LTO,
# single codegen unit and no unwind tables. `cargo test` is unaffected
# (the test profile inherits from dev, not release).
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
tempfile = "3"
egui = "0.36"
eframe = "0.36"
